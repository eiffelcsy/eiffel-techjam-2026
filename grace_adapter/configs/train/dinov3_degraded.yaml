# PoC arm A -- the control. Target is the DEGRADED view itself, detached:
# symmetric self-distillation with no clean teacher anywhere.
#
# Expected to do nothing useful. If it matches arm B on retention, the clean
# teacher was not the mechanism and the headline claim does not hold. Cheap to
# find out precisely because both arms read the same pre-rendered cache -- this
# is the run that costs nothing and can invalidate the project.
#
# Differs from dinov3_clean.yaml in `target_view` and `run_id` alone. Everything
# else, including the adapter geometry, is repeated verbatim rather than
# inherited: an ablation that silently differs in a second key is not an ablation.

run_id: dinov3_degraded

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

# Held-out IMAGES, alongside the cache's held-out degradations. The two answer
# different questions and summary.json reports them separately: the degradation
# axis scores unseen corruptions over images that WERE trained on, and cannot
# speak to generalization across images; these datasets can.
val_datasets:
  - ../eval_pipeline/configs/datasets/ntire_val.yaml
  - ../eval_pipeline/configs/datasets/ntire_val_hard.yaml
val_cache_dirs:
  - cache_val/dinov3-ntire
  - cache_val_hard/dinov3-ntire


cache_dir: cache/dinov3-ntire
epochs: 12
seed: 0
target_view: degraded
source: cache
checkpoint_every: 2

# Matches arm B's cadence so the two held-out curves are sampled at the same
# epochs and can be plotted against each other. Validation forks the RNG, so
# setting it does not perturb a single training draw.
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3

loss:
  w_err: 4.0        # the reference arm's -- NOT the swept key
  w_cos: 0.25
  eps_iso: 0.01

# Optional. `--wandb --wandb-group <experiment>` on the command line does the
# same thing without editing a file, which is what a sweep wants.
wandb:
  enabled: true
  project: grace-adapter
  group: ""
