# Arm B again, but degrading in the loop instead of reading pre-rendered
# features. The check on the whole caching idea.
#
# A cached run trains on E fixed draws per image; a live run draws fresh every
# epoch. If cached and live reach the same retention, the finite epoch set is not
# being exploited and every other run can stay on the fast path. If live wins,
# raise n_epochs and re-render.
#
# Slow: this is the only configuration in which the trunk runs during training.
# Validation still reads the cache, so held-out numbers stay comparable.

run_id: rine_live

detector: ../eval_pipeline/configs/detectors/rine-ldm.yaml
split: grace.splits.rine.RINESplit
dataset: ../eval_pipeline/configs/datasets/sid_set.yaml

cache_dir: cache/rine
epochs: 12
seed: 0
target_view: clean
source: live
batch_size: 32      # images now, not features
num_workers: 8
