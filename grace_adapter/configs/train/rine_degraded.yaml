# Arm A -- the control. Target is the DEGRADED view itself, detached: symmetric
# self-distillation, no clean teacher anywhere.
#
# Expected to do nothing useful. If it matches arm B on retention, the clean
# teacher was not the mechanism and the headline claim does not hold -- a day-2
# finding rather than a day-5 one, and cheap to get precisely because both arms
# read the same pre-rendered cache.

run_id: rine_degraded

detector: ../eval_pipeline/configs/detectors/rine-ldm.yaml
split: grace.splits.rine.RINESplit
dataset: ../eval_pipeline/configs/datasets/sid_set.yaml

cache_dir: cache/rine
epochs: 12
seed: 0
target_view: degraded
source: cache
