# E7 sweep, rung 2 of 3 -- tap_dim AT the rank ceiling. The principled step up.
#
# 128 is not an arbitrary doubling. Each (adapter block, tap) pair reads its tap
# through two linear maps in series:
#
#     LN_k(tap_k) --proj--> R^tap_dim --rung_i^(k)--> R^bottleneck
#
# so that pair's map has rank at most min(tap_dim, bottleneck). At
# `bottleneck: 128` this rung is the LAST one where extra width still buys
# per-pair rank; past it, width only widens the shared subspace (see
# dinov3_sweep_tapdim_256.yaml, which is the rung that tests exactly that).
#
#   tap_dim   ladder    total    x base   per-pair rank
#   32        0.094M    0.695M    1.16x      32
#   64        0.180M    0.781M    1.30x      64          <- dinov3_ladder.yaml
#   128       0.353M    0.953M    1.59x     128          <- this file
#   256       0.697M    1.298M    2.16x     128
#
# This rung is also the cheap answer to "should the projection be per tap?".
# A per-tap projection at tap_dim 64 costs 0.377M; this costs 0.353M. Nearly the
# same budget, spent on one shared 128-d subspace instead of five separate 64-d
# ones. Run this before changing the module: if the shared projection was the
# constraint, widening it should show here, and if it does not, a per-tap
# projection is unlikely to be what the ladder was missing.
#
# THE CACHE IS UNAFFECTED -- every rung reads the same raw (K, 768) taps.
#
# Read on `tap_gate/*` and `cosine_to_clean`. AUC has a 0.0081 hard-split
# standard error and is a guardrail here, not the readout.
#
#   python scripts/train_adapter.py configs/train/dinov3_sweep_tapdim_128.yaml
#
# Identical to dinov3_ladder.yaml except `adapter.tap_dim`.

run_id: dinov3_sweep_tapdim_128

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

split_args:
  tap_blocks: [0, 2, 4, 6, 9]

val_datasets:
  - ../eval_pipeline/configs/datasets/ntire_val.yaml
  - ../eval_pipeline/configs/datasets/ntire_val_hard.yaml
val_cache_dirs:
  - cache_val_taps/dinov3-ntire
  - cache_val_hard_taps/dinov3-ntire

cache_dir: cache_taps/dinov3-ntire
epochs: 12
seed: 0
target_view: clean
source: cache

checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3
  taps: true
  tap_dim: 128      # THE swept key

loss:
  w_err: 2.0
  w_cos: 0.5
  eps_iso: 0.01
  lam_sw: 0.0
  lam_id: 0.0

wandb:
  enabled: true
  project: grace-adapter
  group: e7_ladder_tapdim
