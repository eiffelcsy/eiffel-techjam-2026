# PoC arm B -- the proposed method. The primary label-free result.
#
# Target is the CLEAN view from the cache. Paired with dinov3_degraded.yaml: same
# seed, same cache, same schedule, same epochs, differing in exactly one key.
#
# `checkpoint_every: 2` writes the intermediate adapters experiment E4 needs.
# On this cache a full stage-1 run is seconds, so there is no reason not to.
#
# `val_every: 4` writes held-out numbers alongside the checkpoints E4 trains
# against, so the erasure curve and the retention curve share an x-axis.
# `summary.json` keeps these rows under `val_history`; `validation` stays the
# finished adapter.
#
# Hyperparameters are the v1.2 sweep winner (see checkpoints/grace/
# dinov3_clean_v1.2). The sweep also showed capacity is saturated: 2 blocks
# (v1.1) and a 256 bottleneck (v1.3) land within noise of these numbers.
#
#   python scripts/train_adapter.py configs/train/dinov3_clean.yaml

run_id: dinov3_clean_v1.4

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

# Held-out IMAGES, alongside the cache's held-out degradations. The two answer
# different questions and summary.json reports them separately: the degradation
# axis scores unseen corruptions over images that WERE trained on, and cannot
# speak to generalization across images; these datasets can.
val_datasets:
  - ../eval_pipeline/configs/datasets/ntire_val.yaml
  - ../eval_pipeline/configs/datasets/ntire_val_hard.yaml
val_cache_dirs:
  - cache_val/dinov3-ntire
  - cache_val_hard/dinov3-ntire


cache_dir: cache/dinov3-ntire
epochs: 12
seed: 0
target_view: clean
source: cache
checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128   # 768 -> 128 -> 768: ~0.4M parameters against a 21M frozen
                    # trunk. The parameter budget IS the claim -- if the gap only
                    # closed with a large adapter, the evidence was not merely
                    # displaced. (v1.3 doubled this to 256 and gained nothing.)
  n_blocks: 3

loss:               # the full objective: Jacobian-weighted error + sliced-Wasserstein
  w_err: 3.0
  w_cos: 0.5
  eps_iso: 0.01
  lam_sw: 0.05
  n_proj: 384
  lam_id: 0.05

# Optional. `--wandb --wandb-group <experiment>` on the command line does the
# same thing without editing a file, which is what a sweep wants.
wandb:
  enabled: true
  project: grace-adapter
  group: ""
