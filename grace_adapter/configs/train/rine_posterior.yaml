# Ablation E3c -- posterior sampling on.
#
# Draws k corrections per step and averages LOGITS, not features: E[h(f)] differs
# from h(E[f]) for any nonlinear head, so this is cheap Monte-Carlo posterior
# averaging rather than a restatement of one deterministic pass. k adapter passes
# cost microseconds against the one trunk pass already spent.
#
# Watch `posterior_spread` in the validation block. If it reads ~0 the noise was
# ignored, and that is a reportable negative result about the objective -- pair
# it with rine_no_sw.yaml, which should collapse harder.

run_id: rine_posterior

detector: ../eval_pipeline/configs/detectors/rine-ldm.yaml
split: grace.splits.rine.RINESplit
dataset: ../eval_pipeline/configs/datasets/sid_set.yaml

cache_dir: cache/rine
epochs: 12
seed: 0
target_view: clean
source: cache

adapter:
  noise_dim: 16

sampling:
  k_train: 2
  k_eval: 8
