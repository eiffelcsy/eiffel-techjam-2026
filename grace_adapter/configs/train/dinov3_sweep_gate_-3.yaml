# Gate-init ablation -- sigmoid(-3) = 0.047 instead of sigmoid(-4) = 0.018.
#
# Its control is dinov3_clean.yaml, the reference arm: `gate_init` defaults to
# -4.0, so the reference IS the -4 rung and there is no `dinov3_sweep_gate_-4`.
#
# Identical to the reference except `adapter.gate_init`. Seed, epochs,
# cache, schedule, loss weights, batch size and geometry are copied verbatim;
# change any of them and the result stops being attributable to the init.
#
#   python scripts/train_adapter.py configs/train/dinov3_sweep_gate_-3.yaml
#
# The question
# ------------
# -4 was picked as a round number inside a band, not measured: the constraints
# are "small enough that a broken identity guarantee is still a near-no-op" and
# "not zero, so the gate has gradient from step 0". -3 is the other end of that
# band -- 2.6x the initial gate, and 2.5x the initial sigmoid slope
# (g(1-g) = 0.0451 vs 0.0177), which is the actual mechanism on trial. If the
# gate is gradient-limited early, this is where it shows.
#
# What would count as an effect
# -----------------------------
# Read `grad_norm` and `gate` over the first epoch of `history`, NOT final AUC.
# The claim under test is about the early transient, and hard-split AUC has a
# 0.0081 standard error -- it cannot resolve anything this is likely to move.
#   * `gate` reaching its plateau in fewer steps => the init was holding it back.
#   * `gate` converging to the SAME plateau from both inits => the init is
#     immaterial past the transient, which is the expected result and the one
#     that retires the question.
#   * a HIGHER `cosine_to_clean` at matched step counts => a real win.
#   * clean AUC/retention down => the near-no-op start was doing work, and the
#     0.047 start is already perturbing an input it should leave alone.
#
# Note the identity-at-init guarantee is untouched either way: `fc2` is
# zero-init, so the correction is identically zero at step 0 for ANY gate.
# `test_identity_at_init` covers this and passes at both values.

run_id: dinov3_sweep_gate_-3

detector: eval/configs/detectors/dinov3-wildfake.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_val/dinov3-wildfake

cache_dir: cache/dinov3-wildfake
epochs: 12
seed: 0
target_view: clean
source: cache
checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3
  gate_init: -3.0   # THE swept key. sigmoid(-3) = 0.0474

loss:
  w_err: 4.0
  w_cos: 0.25
  eps_iso: 0.01

wandb:
  enabled: false    # flip on with --wandb --wandb-group e_gate_init
  project: grace-adapter
  group: e_gate_init
