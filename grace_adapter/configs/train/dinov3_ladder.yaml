# The ladder arm. Identical to dinov3_clean_final.yaml except for the taps.
#
#   python scripts/build_cache.py configs/cache/dinov3_taps.yaml   # PREREQUISITE
#   python scripts/train_adapter.py configs/train/dinov3_ladder.yaml
#
# This is a controlled comparison and it only stays one if it is read as one.
# Against the canonical the differences are: `cache_dir` (the tap cache), `split_args`
# (which blocks the split emits) and `adapter.taps`/`adapter.tap_dim`. Seed,
# epochs, schedule, loss weights, batch size and adapter geometry are copied
# verbatim. Change any of them and the result stops being attributable to the
# ladder.
#
# What it should show
# -------------------
# The plain adapter has to infer, from the seam alone, which stage the damage
# entered at -- and it is nearly blind to that (0.376 vs 0.896 nine-way transform
# ID; see DEFAULT_TAP_BLOCKS in grace/splits/dinov3.py). If displaced evidence is
# recoverable at all, knowing WHERE it was displaced from should recover more of
# it. If retention does not move, the honest reading is that the correction was
# never information-limited in that way, and the seam was enough.
#
# The parameter budget still has to hold. The ladder adds ~0.22M on top of the
# base adapter, so the "tiny correction, not a re-trained model" claim survives
# -- but if a ladder only helps once `tap_dim` is pushed up, that is a capacity
# result rather than a localization one, and worth saying plainly.
#
# `tap_gate/*` in summary.json's history is the figure this arm exists to make:
# how much the correction leans on each block, per degradation. It is the
# per-layer gate the RINE `layers` split promised, on a detector that does not
# need a `layers` head to produce it.

run_id: dinov3_ladder

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

# MUST match the cache this trains against. `CacheSpec.taps` records what was
# rendered and `FeatureCache` refuses a mismatch at startup, so a stale value
# here fails immediately rather than training on the wrong trunk depth.
split_args:
  tap_blocks: [0, 2, 4, 6, 9]

val_datasets:
  - ../eval_pipeline/configs/datasets/ntire_val.yaml
  - ../eval_pipeline/configs/datasets/ntire_val_hard.yaml
# Rendered with the SAME tap_blocks -- a val cache without taps would fail in
# `_load_val_sets` before training starts, which is where you want to find out.
val_cache_dirs:
  - cache_val_taps/dinov3-ntire
  - cache_val_hard_taps/dinov3-ntire

cache_dir: cache_taps/dinov3-ntire
epochs: 12
seed: 0
target_view: clean
source: cache
checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3
  taps: true
  tap_dim: 64       # the ladder's parameter count is almost entirely this knob:
                    # ~0.22M at 64 over five 768-wide taps. Raise it only as a
                    # deliberate capacity experiment -- see the budget table in
                    # grace/models/ladder.py.

loss:               # verbatim from dinov3_clean_final.yaml -- see the note above.
                    # Both lam_sw and lam_id are 0 there: SW's premise does not
                    # hold on this detector (the adapted cloud is OVER-dispersed)
                    # and the identity term cannot be bought a meaningful share.
  w_err: 2.0
  w_cos: 0.5
  eps_iso: 0.01
  lam_sw: 0.0
  lam_id: 0.0

wandb:
  enabled: true
  project: grace-adapter
  group: ""
