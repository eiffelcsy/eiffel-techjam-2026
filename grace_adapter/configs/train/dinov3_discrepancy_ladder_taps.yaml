# GRACE-D over a ladder, WITH the per-block damage profile. The arm the ladder
# was worth combining with GRACE-D for.
#
#   python scripts/train_discrepancy.py configs/train/dinov3_discrepancy_ladder_taps.yaml
#
# Identical to dinov3_discrepancy_ladder.yaml except `discrepancy.use_taps`, and
# that pair IS the experiment: same frozen adapter, same images, same fusion,
# differing only in whether the head is told where the damage entered.
#
# What the key buys
# -----------------
# Without it the head sees ONE drift norm, because `DINOv3Split.feature_spec` is
# `vector (768,)` and Δ is one vector however deep the damage went -- the ladder
# changes the CORRECTION, not the head's description of it. With it the head also
# gets `log1p(|tap_drift_k|)` for each of the five tapped blocks: the per-block
# damage profile a `layers` seam like RINE's would have handed GRACE-D for free.
# Five extra inputs on a 66-wide head, and no new stage-1 training -- the ladder
# computes that tensor for its own forward pass either way.
#
# Why it might still be nothing
# -----------------------------
# The beta sweep on the plain arm (scripts/sweep_beta.py, run disc_gate_ctrl) put
# the fusion's ceiling at 0.9917 retention over ALL beta, with the two image sets
# peaking at OPPOSITE signs. That ceiling was set by the aux logit being redundant
# with the main head, not by Δ being uninformative -- `auc_aux` was already 0.855
# standalone. If depth is the missing axis, this is where it shows; if the
# redundancy is the real limit, five more inputs will not move it, and the honest
# reading is that GRACE-D needs a detector with more headroom than DINOv3 has
# here rather than a richer input.
#
# Read `auc_aux` first, not `auc_fused`. Aux is what the extra inputs act on
# directly; fused is aux filtered through a redundancy the taps may not touch.

run_id: disc_ladder_taps
cache_dir: cache_taps/dinov3-wildfake
adapter_checkpoint: checkpoints/grace/dinov3_ladder_final/ema.pt

detector: eval/configs/detectors/dinov3-wildfake.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

# MUST match what the adapter was trained against. `load_adapter` refuses a
# ladder whose tap set differs from the split's, so a stale value here fails at
# startup rather than scoring a model reading the wrong trunk depth.
split_args:
  tap_blocks: [0, 2, 4, 6, 9]

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_val_taps/dinov3-wildfake

epochs: 4
batch_size: 64
seed: 0

discrepancy:
  hidden: 256
  proj: 64
  use_severity: true
  use_taps: true    # THE swept key

wandb:
  enabled: false
  project: grace-adapter
  group: ""
