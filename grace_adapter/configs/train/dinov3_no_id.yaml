# E3d, the ablation -- identity anchoring OFF. RUN THIS FIRST.
#
# The identity term is 0.051% of the objective at dinov3_clean's `lam_id: 0.1`
# (measured: identity ~= 1.19e-4 against a 0.0232 total). That share says the
# term is probably inert, but share of loss is NOT the same as influence on the
# solution -- a term with small magnitude can still steer a direction nothing
# else constrains. This run is what turns the arithmetic into evidence.
#
# It is the counterpart of dinov3_no_sw.yaml, which is what let us conclude that
# lam_sw at 0.05 does nothing: `no_sw` came back indistinguishable from the
# baseline on every metric including the training curves. Until this arm exists,
# no equivalent claim about lam_id is supported.
#
# Decision rule for the sweep in dinov3_sweep_id_{2,8,32}.yaml:
#   this run ~= dinov3_clean  -> lam_id is inert at 0.1, and the sweep is worth
#                                running to find a weight where it is not
#   this run differs          -> the term is already doing work at 0.1 and the
#                                sweep should be read as a tuning curve, not as
#                                a search for whether the term matters at all
#
# `lam_id: 0.0` would once have silenced the `identity` diagnostic along with
# the term -- total_loss gated logging on the same `lam > 0` as the loss itself.
# It now reports every term on logging steps regardless of weight, so this arm
# can be read on the quantity it ablates.
#
#   python scripts/train_adapter.py configs/train/dinov3_no_id.yaml
#
# Identical to dinov3_clean.yaml except `loss.lam_id`.

run_id: dinov3_no_id

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

val_datasets:
  - ../eval_pipeline/configs/datasets/ntire_val.yaml
  - ../eval_pipeline/configs/datasets/ntire_val_hard.yaml
val_cache_dirs:
  - cache_val/dinov3-ntire
  - cache_val_hard/dinov3-ntire

cache_dir: cache/dinov3-ntire
epochs: 12
seed: 0
target_view: clean
source: cache

checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3

loss:
  w_err: 2.0
  w_cos: 0.5
  eps_iso: 0.01
  lam_sw: 0.05
  n_proj: 384
  lam_id: 0.0       # THE ablated key

wandb:
  enabled: true
  project: grace-adapter
  group: e3d_id_sweep
