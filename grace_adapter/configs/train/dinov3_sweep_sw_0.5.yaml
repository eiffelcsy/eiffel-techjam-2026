# E3b sweep, rung 1 of 3 -- lam_sw at a weight where the term actually exists.
#
# At dinov3_clean's `lam_sw: 0.05` the sliced-Wasserstein term is 0.071% of the
# objective (measured: sw ~= 3.31e-4 against a 0.0232 total), which is why
# dinov3_no_sw is indistinguishable from the baseline. That null result is a
# property of the WEIGHT, not evidence about distribution matching. This ladder
# puts the term into the loss so the question can be asked at all.
#
#   lam_sw     predicted share of the objective
#   0.05       0.07%   <- dinov3_posterior.yaml, the anchor of this ladder
#   0.5        0.71%   <- this file
#   2          2.77%
#   8         10.23%
#
# Shares are first-order: they hold `sw` at its v1.2 convergence value, and a
# larger weight makes the optimizer actively suppress the term, so the REALISED
# share will land below the prediction. Read it out of each run's own history
# rather than trusting this table.
#
# `noise_dim: 16` is deliberate and makes dinov3_posterior.yaml -- not
# dinov3_clean.yaml -- the parent of this ladder. The readout is
# `posterior_spread`, which ranges 0.0 to ~0.36 and is measured over 260 logged
# steps; hard-split AUC has a 0.0081 standard error and cannot resolve what this
# sweep is looking for. Do not rank these arms on AUC. If spread tracks lam_sw,
# the SW term is what keeps the noise alive; if it sits near 0.3 throughout, the
# coupled claim in EXPERIMENTS.md E3b+E3c is dead.
#
#   python scripts/train_adapter.py configs/train/dinov3_sweep_sw_0.5.yaml
#
# Identical to dinov3_posterior.yaml except `loss.lam_sw`.

run_id: dinov3_sweep_sw_0.5

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

val_datasets:
  - ../eval_pipeline/configs/datasets/ntire_val.yaml
  - ../eval_pipeline/configs/datasets/ntire_val_hard.yaml
val_cache_dirs:
  - cache_val/dinov3-ntire
  - cache_val_hard/dinov3-ntire

cache_dir: cache/dinov3-ntire
epochs: 12
seed: 0
target_view: clean
source: cache

checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3
  noise_dim: 16

loss:
  w_err: 2.0
  w_cos: 0.5
  eps_iso: 0.01
  lam_sw: 0.5       # THE swept key
  n_proj: 384
  lam_id: 0.1

sampling:
  k_train: 2
  k_eval: 8

wandb:
  enabled: true
  project: grace-adapter
  group: e3b_sw_sweep
