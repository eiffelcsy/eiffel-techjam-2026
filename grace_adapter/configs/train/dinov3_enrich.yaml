# Stage 2, the frequency enricher, against a FROZEN stage-1 adapter.
#
#   python scripts/train_enrich.py configs/train/dinov3_enrich.yaml
#
# A sibling of dinov3_discrepancy.yaml, not a replacement. Both freeze the same
# adapter and both use labels; they differ in what they read. GRACE-D reads the
# drift the adapter already computed; this reads the image again, in a basis the
# trunk's resize destroyed.
#
# THE ARMS THAT HANG OFF THIS FILE, one key each:
#
#   E11  enricher.n_bands: 1        single branch instead of the HF/LF pair
#   E13  enricher.top_k: 16         the 16 lowest radial coefficients per channel
#   E13  enricher.pos_emb: false    cells become an unordered set
#   E14  finetune_head: true        --finetune-head does the same from the CLI
#   E15  lam_anchor: 0.0            --lam-anchor 0 likewise
#   E16  the crop range             swept in the CACHE, not here -- a narrower
#                                   range is a different render
#
# The CLI flags exist so a sweep is five invocations rather than five near-
# identical files; the ones that are worth a file get one when they are reported.
#
# READ `validation.step_0` FIRST in the summary. It is scored before the first
# optimizer step, when every expert's output projection is still zero, so
# `auc_fused` must equal `auc_corrected` -- the `+grace` arm -- to the last
# decimal. train_enrich.py exits non-zero if it does not.
#
# READ `parallel_fraction` FROM analyze_drift.py BEFORE reading any gain. Round 1
# measured 0.0298: 97% of feature drift lay in directions the frozen head cannot
# see. If that holds here, a frozen head reduces this whole cross-attention
# module to a scalar logit shift, which is GRACE-D's function class at a thousand
# times the parameters -- and the honest headline is then the fine-tuned arm,
# reported as such, with the head's provenance given up.

run_id: dinov3_enrich
cache_dir: cache_ms/dinov3-wildfake-multiscale
adapter_checkpoint: checkpoints/grace/dinov3_multiscale/ema.pt

detector: ../eval_pipeline/configs/detectors/dinov3-wildfake-multiscale.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/wildfake_train.yaml

# Held-out IMAGES. Not optional here. The training cache's val-numbered epochs
# hold out DEGRADATIONS over images the adapter saw; this stage is supervised, so
# the failure worth catching is a module that learned the corpus's content -- and
# that one looks excellent on unseen corruptions of seen pictures.
val_datasets:
  - ../eval_pipeline/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_ms_val/dinov3-wildfake-multiscale

epochs: 4
batch_size: 256
lr: 0.001
seed: 0

lam_anchor: 0.1     # ||fused - f_corrected||; 0.0 is E15
finetune_head: false # THE swept key for E14

enricher:
  d_model: 256
  n_heads: 4
  n_bands: 2        # HF and LF; 1 is E11
  gate_init: -4.0
  severity_film: true
  pos_emb: true
  top_k: null       # all 64 coefficients per channel; an int is E13
  learn_masks: true

# Must match what the cache was rendered with -- `freq_sha` is checked at
# startup, because the same (196, 192) shape can hold entirely different
# frequencies and the band masks are indexed by position along that axis.
freq:
  enabled: true
  patch: 8
  grid: 14
  channels: 3
  radial: true
  norm: log1p

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json

wandb:
  enabled: true
  project: grace-adapter
  group: ""
