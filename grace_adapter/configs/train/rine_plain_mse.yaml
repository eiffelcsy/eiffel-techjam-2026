# Ablation E3a -- plain MSE. Exactly the GRACE v1 objective.
#
# `weighting: none` is provably F.mse_loss, not an approximation of it (see
# tests/test_losses.py::test_eps_one_is_exactly_plain_mse), so the comparison
# against rine_clean.yaml isolates one change.
#
# The figure this run produces: cos(delta, j_head), logged every 50 steps. If it
# sits near zero here and rises under Jacobian weighting, the plain objective was
# spending nearly all of the adapter's capacity on feature directions the frozen
# head cannot see.

run_id: rine_plain_mse

detector: ../eval_pipeline/configs/detectors/rine-ldm.yaml
split: grace.splits.rine.RINESplit
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

cache_dir: cache/rine
epochs: 12
seed: 0
target_view: clean
source: cache

loss:
  weighting: none
  lam_kl: 0.5       # v1's weight -- head_kl was the only decision-aware term then
