# Stage 0 for the crop arm.
#
#   python scripts/train_probe.py configs/probe/dinov3_wildfake_crop.yaml
#
# Identical to dinov3_wildfake.yaml except for `detector` and `run_id`: the point
# of the arm is that preprocessing is the only variable. Same manifest, same
# selection split, same head geometry, same optimizer, same seed -- INCLUDING
# the val split, because selecting the two heads on different data would
# confound the one variable the arm exists to isolate.
#
# Clean images only, still -- see train_probe.py. The crop is not augmentation,
# it is a change to what resolution the trunk reads the image at, and it applies
# identically at eval.

run_id: dinov3_wildfake_crop

detector: ../eval_pipeline/configs/detectors/dinov3-wildfake-crop.yaml
dataset: ../eval_pipeline/configs/datasets/wildfake_train.yaml       # split: train, 100,000
val_dataset:
  - ../eval_pipeline/configs/datasets/wildfake_train_val.yaml        # 20,000, balanced

split: grace.splits.dinov3.DINOv3Split
out: ""             # "" = take it from the detector config's head_checkpoint

hidden: 512
n_layers: 2
dropout: 0.0

epochs: 40
lr: 0.001
weight_decay: 0.01
batch_size: 32
head_batch_size: 64
num_workers: 4
seed: 0
device: auto

wandb:
  enabled: false
  project: grace-adapter
  group: ""
