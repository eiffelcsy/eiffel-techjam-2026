# GRACE on the PoC detector, STOCHASTIC arm -- k_eval: 8.
#
#   cd ../eval_pipeline
#   python scripts/run_eval.py --config configs/runs/dinov3_poc_grace.yaml \
#     --detector ../grace_adapter/configs/detectors/dinov3+grace-k8-sweep_sw_8.yaml
#
# Identical to dinov3+grace.yaml except `k_eval` and `checkpoint`. That file
# pins k_eval: 1, which is correct for every deterministic arm and WRONG here.
#
# Why the distinction is easy to miss: AdaptedDetector.forward computes
#
#     k = self.k_eval if self.adapter.stochastic else 1
#
# so for a `noise_dim: 0` checkpoint k_eval is ignored outright -- 1 and 8 give
# byte-identical scores, and every config in the repo could pin 1 forever with
# no consequence. The moment the checkpoint underneath has a noise input, that
# same `k_eval: 1` silently scores ONE posterior draw instead of averaging 8.
# It does not raise; it just reports a noisier number that understates the
# method. AdaptedDetector now warns on exactly this combination.
#
# 8 is not arbitrary -- it is `sampling.k_eval` from the train configs, so the
# harness score and the in-loop `validation` block measure the same estimator.
# Averaging is over LOGITS, not features: E[h(f)] != h(E[f]) for a nonlinear
# head, which is what makes the extra draws worth their microseconds.
#
# Point `checkpoint` at whichever stochastic arm is being scored:
#   checkpoints/grace/dinov3_posterior/ema.pt      (E3c, lam_sw 0.05)
#   checkpoints/grace/dinov3_sweep_sw_0.5/ema.pt   (E3b ladder)
#   checkpoints/grace/dinov3_sweep_sw_2/ema.pt
#   checkpoints/grace/dinov3_sweep_sw_8/ema.pt

name: dinov3+grace-k8-sweep_sw_8
target: grace.detectors.adapted.AdaptedDetector
args:
  base: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
  split: grace.splits.dinov3.DINOv3Split
  checkpoint: ../grace_adapter/checkpoints/grace/dinov3_sweep_sw_8/ema.pt
  discrepancy: null
  k_eval: 8
device: auto
