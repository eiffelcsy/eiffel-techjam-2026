# GRACE on the PoC detector -- DINOv3 with the trained, LABEL-FREE adapter.
#
#   cd ../eval_pipeline
#   python scripts/run_eval.py --config configs/runs/dinov3_poc_grace.yaml
#
# Same conditions, same clean threshold rule, same retention denominator, same
# result JSON as the baseline, because it is the same harness. The baseline and
# the adapted model differ by this one file.
#
# Ceiling: restoration cannot exceed the clean-feature score, so retention <= 1.0
# by construction. Beating that is GRACE-D's job.
#
# `k_eval: 1` because dinov3_clean.yaml leaves `noise_dim: 0` -- the adapter is
# deterministic and AdaptedDetector forces k to 1 regardless. Stated rather than
# left at the 8 default so the config does not imply sampling that is not
# happening. Turn on posterior sampling by setting `noise_dim` in the TRAIN
# config (alongside lam_sw, never alone) and raising this to 8.

name: dinov3+grace
target: grace.detectors.adapted.AdaptedDetector
args:
  base: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
  split: grace.splits.dinov3.DINOv3Split
  checkpoint: ../grace_adapter/checkpoints/grace/dinov3_clean/ema.pt
  discrepancy: null
  k_eval: 1
device: auto
