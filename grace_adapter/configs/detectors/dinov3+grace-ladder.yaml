# GRACE with the ladder adapter, scored by the Day-1 harness like any other model.
#
#   cd ../eval_pipeline
#   python scripts/run_eval.py --config configs/runs/dinov3_poc_grace.yaml \
#     --detector ../grace_adapter/configs/detectors/dinov3+grace-ladder.yaml
#
# `split_args.tap_blocks` MUST match what the checkpoint was trained on. It is
# not a preference here -- it decides which activations the ladder reads, and a
# ladder reading blocks it was never fitted to would still produce logits.
# `load_adapter` compares the checkpoint's stored tap spec against the split's
# and refuses a mismatch, so the failure is a startup error rather than a
# plausible retention curve for a model nobody trained.
#
# Inference cost over dinov3+grace.yaml is the tap projections and nothing else:
# `trunk_with_taps` is one forward pass, and the taps are activations that pass
# already computed and threw away. No second trunk, no extra image decode.
#
# k_eval: 1 is correct here only while the checkpoint is deterministic
# (noise_dim: 0). Pair a stochastic ladder with 8, as dinov3+grace-k8.yaml does
# and for the reason documented there.

name: dinov3+grace-ladder
target: grace.detectors.adapted.AdaptedDetector
args:
  base: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
  split: grace.splits.dinov3.DINOv3Split
  split_args:
    tap_blocks: [0, 2, 4, 6, 9]
  checkpoint: ../grace_adapter/checkpoints/grace/dinov3_ladder/ema.pt
  discrepancy: null
  k_eval: 1
device: auto
