# E10, arm crop200: THE IDENTITY GATE for the frequency branch.
#
# `enricher: null` builds a FRESHLY INITIALIZED enricher -- not a missing one.
# Every expert's output projection is zero at init, so `fused == f_corrected`
# bit for bit and this arm must reproduce dinov3-crop200+grace.yaml to the last
# decimal, through the full harness: same conditions, same threshold, same
# retention denominator.
#
# WHY BUILD IT RATHER THAN SKIP IT. Skipping the module would test that
# FusedDetector can be bypassed. E10 asks whether the module -- built, wired,
# forward-passed over real DCT tokens -- is the identity, which is the claim that
# makes every later number attributable to what the enricher LEARNED rather than
# to having spliced it in. Same reasoning as dinov3+identity.yaml for stage 1,
# and it is a hard stop in run_all.sh for the same reason.
#
# It also exercises the aux pathway end to end: `aux_fn` runs in the workers,
# `Inputs` crosses the collate, and the tokens reach `forward`. A wiring bug
# there shows up here as a difference, not as a crash.

name: dinov3-crop200+grace-freq-null
target: grace.detectors.fused.FusedDetector
args:
  base: ../eval_pipeline/configs/detectors/dinov3-wildfake-crop200.yaml
  split: grace.splits.dinov3.DINOv3Split
  checkpoint: ../grace_adapter/checkpoints/grace/dinov3_multiscale/ema.pt
  enricher: null                                                          # THE swept key
  freq: {patch: 8, grid: 14, channels: 3, radial: true, norm: log1p}
device: auto
