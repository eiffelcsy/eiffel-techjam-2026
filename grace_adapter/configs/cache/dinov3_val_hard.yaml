# Stage-1 image-level validation cache -- NTIRE val HARD subset.
#
#   python scripts/build_cache.py configs/cache/dinov3_val_hard.yaml --dry-run
#   python scripts/build_cache.py configs/cache/dinov3_val_hard.yaml
#
# `out_dir` is per-DATASET, not the shared default. build_cache derives its root
# as `{out_dir}/{detector_name}`, so two datasets rendered for one detector
# under the same out_dir collide -- the second render is rejected on
# `manifest_sha` rather than silently mixing rows from both. One out_dir each.
#
# 2500 images, rendered with the full degraded view set like the training
# cache.
#
# CAVEAT -- read before comparing these numbers to the ntire_val ones.
# ntire_val_hard.yaml says "Score at LEVEL 0 ONLY": its images already carry
# adversarial embedding attacks, a neural codec (jpeg_ai) and recompression
# chains. Rendering our L1-L3 grid on top composes our corruption with theirs,
# so `cosine_to_clean` on epochs 1..11 here measures a compound degradation and
# is NOT on the same scale as the ntire_val figure. The clean view (L0) and the
# relative ordering across checkpoints stay meaningful; the absolute value does
# not transfer. Rendered this way deliberately, for a uniform validation surface.

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_val_hard.yaml

out_dir: cache_val_hard/
n_epochs: 12
n_val_epochs: 2
batch_size: 8          # IMAGES per batch; each carries all 15 views
trunk_batch_size: 128
num_workers: 8

schedule: {}      # the standard training mix: all eleven transforms, default weights
