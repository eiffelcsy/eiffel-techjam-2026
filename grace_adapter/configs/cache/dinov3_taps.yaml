# The PoC cache PLUS intermediate taps, for the ladder adapter.
#
#   python scripts/build_cache.py configs/cache/dinov3_taps.yaml --dry-run
#   python scripts/build_cache.py configs/cache/dinov3_taps.yaml
#
# Run --dry-run. This is the config that makes it mandatory rather than polite:
# five taps at cls+patchmean width are 7.5 KB per image per view against the
# seam's 1.5 KB, so the total is SIX times configs/cache/dinov3.yaml.
#
#     features   vector(768,)       1.5 KB/image/view       6.4 GB
#     taps       5 x (768,)         7.5 KB/image/view      32.0 GB
#     total                         9.0 KB/image/view      38.4 GB
#
# Why a separate out_dir
# ----------------------
# Taps are additional VIEWS in the same layout, so rendering them into
# `cache/dinov3-ntire` would work -- and would rewrite the feature shards that
# are already there, because `ShardWriter` opens shards with `mode="w+"`, which
# truncates. An interrupted tap render would then leave the working cache half
# destroyed. The trunk pass has to run again either way (that is what produces
# the taps), so nothing is saved by sharing the directory and a usable cache is
# risked. Render beside it.
#
# Why these blocks
# ----------------
# `tap_blocks` indexes `output_hidden_states`: 0 is the patch embedding, 1..12
# the block outputs. The set was measured, not spaced -- see DEFAULT_TAP_BLOCKS
# in grace/splits/dinov3.py for the table. Short version: asked which of nine
# transforms hit an image, the seam alone scores 0.376 and these five score
# 0.896, chance being 0.111. Block 12 is absent because pooled it IS the seam.
#
# Changing this list invalidates the cache for any ladder trained against the
# old one: `CacheSpec.taps` records the names and a mismatched train run is
# refused at startup rather than silently reading a different trunk depth.

detector: ../eval_pipeline/configs/detectors/dinov3-ntire.yaml
split: grace.splits.dinov3.DINOv3Split
dataset: ../eval_pipeline/configs/datasets/ntire_train.yaml

split_args:
  tap_blocks: [0, 2, 4, 6, 9]

out_dir: cache_taps/
n_epochs: 12
n_val_epochs: 2
batch_size: 8          # IMAGES per batch; each carries every view
trunk_batch_size: 128
num_workers: 4
# 4, not the usual 8, and the reason is host RAM rather than throughput.
# `pipeline.degrade.ops.gaussian_noise` draws its noise with `rng.normal(...)`,
# which returns FLOAT64: on a 4032x3024 NTIRE train image that is a 279 MiB
# noise array plus a 279 MiB sum, so ~560 MB of transient per call, per worker.
# At 8 workers that is ~4.5 GB of spikes on a 16 GB box and the render dies with
# a MemoryError inside a DataLoader worker, part-way through. The val sets never
# hit it -- their images are small enough.
#
# Halving the workers halves the spike. It costs little: the writer's own
# measurements put 8 workers at ~2.4x a single one, not 8x, because PIL
# degradation on 2 MP images is memory-bound on six physical cores.
#
# Do NOT fix this by casting the noise to float32. `rng.normal(0, s, shape)` and
# `rng.standard_normal(shape, dtype=float32) * s` consume the bit stream
# differently, so the degradations would stop matching every cache already
# rendered -- including the one dinov3_clean.yaml, the reference arm, uses.
# Chunking the float64 draw by row blocks preserves the stream exactly and is
# the safe optimisation if this ever needs to be faster.
#
# Render nothing else at the same time. A concurrent stage-1 run is enough extra
# resident memory to push this over on this machine.

schedule: {}      # the standard training mix: all eleven transforms, default weights
