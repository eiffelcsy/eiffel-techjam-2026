[project]
name = "grace-adapter"
version = "0.1.0"
description = "Gated Residual Adapter for Clean-feature Estimation"
requires-python = ">=3.10"
# Everything heavy is already a dependency of the sibling harness, which this
# package imports (`pipeline.*`) rather than vendors. Install that first, from
# ../eval_pipeline, including its [zoo] extra for the detectors being adapted.
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "tqdm",
    "scikit-learn",   # stage 2 reports main / aux / fused AUC in-loop
]

[project.optional-dependencies]
dev = ["pytest"]
# Optional tracking. `grace.train.tracker` is a null object when this is absent
# or when no config enables it, so nothing in the package imports wandb unless
# asked -- and a run with tracking off writes exactly the same files.
wandb = ["wandb"]
# The proof-of-concept detector (README section 8): a DINOv3 ViT-S/16 trunk from
# the Hub. `transformers` already comes in via the sibling harness; this extra
# exists to name the requirement rather than to add a package.
poc = ["transformers>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grace*"]
