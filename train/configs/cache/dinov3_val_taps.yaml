# Stage-1 image-level validation cache WITH taps -- the held-out split of
# wildfake_train.
#
#   python scripts/build_cache.py configs/cache/dinov3_val_taps.yaml --dry-run
#   python scripts/build_cache.py configs/cache/dinov3_val_taps.yaml
#
# The tap twin of dinov3_val.yaml. It exists because `_load_val_sets` checks the
# val caches against the same tap expectation as the training cache: a ladder run
# whose val caches were rendered without taps is refused before training starts,
# not after it.
#
# `tap_blocks` must match configs/cache/dinov3_taps.yaml exactly.

detector: eval/configs/detectors/dinov3-wildfake.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train_val.yaml

split_args:
  tap_blocks: [0, 2, 4, 6, 9]

out_dir: cache_val_taps/
n_epochs: 12
n_val_epochs: 2
batch_size: 8
trunk_batch_size: 128
num_workers: 8

schedule: {}
