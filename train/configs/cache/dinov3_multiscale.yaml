# The spatial cache under the MULTI-SCALE protocol -- the crop-era dinov3.yaml.
#
#   python scripts/build_cache.py configs/cache/dinov3_multiscale.yaml --dry-run
#   python scripts/build_cache.py configs/cache/dinov3_multiscale.yaml
#
# Two keys apart from configs/cache/dinov3.yaml: the detector (which records the
# protocol) and the `crop:` block (which supplies it). They are one change --
# `probe.train._assert_crop_matches_input_mode` refuses either without the other.
#
# WHY A SECOND CACHE RATHER THAN AN EDIT. The old one is not wrong, it is
# whole-image, and `CacheSpec.crop_sha` compares strictly with the empty string
# included -- so a run configured for windows can never read it by accident. Two
# roots, two protocols, no ambiguity about which produced a number. Delete the
# old one when the crop-era numbers are in, not before.
#
# WHY IT HAS TO BE RE-RENDERED AT ALL. The trunk now sees 128-S_MAX px windows at
# native pixel scale. That is a different feature space, not a harder version of
# the same one, and an adapter trained to map whole-image degraded features onto
# whole-image clean ones has learned a mapping between pixels nothing downstream
# will ever show it again.

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

out_dir: cache_ms/
n_epochs: 12
n_val_epochs: 2
batch_size: 8          # IMAGES per batch; each carries all 15 views
trunk_batch_size: 128
num_workers: 8

schedule: {}      # the standard training mix: all eleven transforms, default weights

# THE AUDITED RANGE. `s_max` is absent on purpose and `CropConfig` raises without
# it: the largest window every image can supply from its own pixels is a property
# of the corpus, not of the method, and an unaudited 128-512 range scored
# E-cropsize 0.9895 on wildfake_test -- almost exactly the shortcut the crop was
# introduced to remove.
#
# `scripts/after_fetch.sh --write-range` fills it in, in every config that
# carries this placeholder, from results/audit_sizes__wildfake-train.json.
# tests/test_configs.py then checks the seven files agree on the number.
# THE MERGE, 2026-08-30. The frequency view rides along in this render rather
# than getting its own pass.
#
# The writer does ONE decode-degrade-crop pass and renders every view from it --
# that is why taps ride along, and the DCT view uses the same mechanism. A
# separate cache_freq/ would have re-decoded, re-degraded and re-cropped the
# same 49,999 images to recompute spatial features that are bit-identical here:
# same detector, same dataset, same schedule, same crop seed.
#
# It also buys VIEWS. The standalone freq cache rendered clean + 5 + 1; riding
# along here it gets clean + 12 + 2, which is 2.4x the stage-2 training data --
# and that matters more since the corpus halved to 50k, because the original
# "5 degraded views is plenty" was reasoned against 100k images.
#
# Spent only after E0-freq passed on wildfake_train_val: E-freqonly 0.7002
# against an E-rolloff floor of 0.5780, a margin of +0.2443 where +0.05 was
# required. Rendering it before that gate would have inverted the ordering
# after_freq.sh exists to enforce.
#
# ~75 KB/image/view against the spatial features' 1.5 KB, so this is what makes
# the cache ~57 GB rather than 1.2 GB. The coefficient set is a render-time
# commitment -- views resume, `patch`/`grid`/`radial` do not.
freq:
  enabled: true
  patch: 8           # JPEG's block size, so JPEG artefacts land on resolvable coefficients
  grid: 14           # 196 cells, one per DINOv3 patch token at 224
  channels: 3
  radial: true       # a band is then a contiguous slice, which E13's top-k needs
  norm: log1p

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json
