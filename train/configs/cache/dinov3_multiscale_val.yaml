# Stage-1 image-level validation cache, multi-scale protocol.
#
#   python scripts/main/build_cache.py configs/cache/dinov3_multiscale_val.yaml
#
# configs/cache/dinov3_multiscale.yaml with the dataset and out_dir swapped, for
# the reason the pre-crop pair had: `build_cache.py` derives its root from the
# DETECTOR name alone, so two datasets rendered for one detector under one
# out_dir collide -- and the second render is rejected on `manifest_sha` rather
# than silently mixing rows from both. One out_dir per dataset.
#
# 10,000 images, balanced 5k real / 5k generated, disjoint from the training
# split by construction: one sampler cut both from a single draw per stratum. The
# crop range MUST match the training cache's -- a val set windowed differently is
# measuring a protocol shift, not generalization -- which is what
# tests/test_configs.py::test_every_crop_config_agrees_on_the_range enforces.

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train_val.yaml

out_dir: cache_ms_val/
n_epochs: 12
n_val_epochs: 2
batch_size: 8
trunk_batch_size: 128
num_workers: 8

schedule: {}

# THE MERGE, 2026-08-30. The frequency view rides along in this render rather
# than getting its own pass.
#
# The writer does ONE decode-degrade-crop pass and renders every view from it --
# that is why taps ride along, and the DCT view uses the same mechanism. A
# separate cache_freq/ would have re-decoded, re-degraded and re-cropped the
# same 49,999 images to recompute spatial features that are bit-identical here:
# same detector, same dataset, same schedule, same crop seed.
#
# It also buys VIEWS. The standalone freq cache rendered clean + 5 + 1; riding
# along here it gets clean + 12 + 2, which is 2.4x the stage-2 training data --
# and that matters more since the corpus halved to 50k, because the original
# "5 degraded views is plenty" was reasoned against 100k images.
#
# Spent only after E0-freq passed on wildfake_train_val: E-freqonly 0.7002
# against an E-rolloff floor of 0.5780, a margin of +0.2443 where +0.05 was
# required. Rendering it before that gate would have inverted the ordering
# after_freq.sh exists to enforce.
#
# ~75 KB/image/view against the spatial features' 1.5 KB, so this is what makes
# the cache ~57 GB rather than 1.2 GB. The coefficient set is a render-time
# commitment -- views resume, `patch`/`grid`/`radial` do not.
freq:
  enabled: true
  patch: 8           # JPEG's block size, so JPEG artefacts land on resolvable coefficients
  grid: 14           # 196 cells, one per DINOv3 patch token at 224
  channels: 3
  radial: true       # a band is then a contiguous slice, which E13's top-k needs
  norm: log1p

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json
