# Stage 0 under the multi-scale protocol -- the head every later arm loads.
#
#   python scripts/main/train_probe.py train/configs/probe/dinov3_wildfake_multiscale.yaml

run_id: dinov3_wildfake_multiscale

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
dataset: load_data/configs/datasets/wildfake_train_combined.yaml  # split: train, 58,656 (49,999 WildFake + 6k FLUX + 200 Seedream + 2,457 reals)

val_dataset:
  - load_data/configs/datasets/wildfake_train_val_combined.yaml   # 14,000, balanced 7k/7k

split: eval.splits.dinov3.DINOv3Split
out: ""             # "" = take it from the detector config's head_checkpoint

# `s_max` is deliberately absent because the safe upper bound is a property of
# the corpus and not of the method. A window larger than a source cannot be
# taken, so if one class's images are systematically smaller its crops are too,
# and the realized crop size becomes the label.
#
# Fill it from the audit:
#
#   python scripts/misc/audit_sizes.py \
#       --config load_data/configs/datasets/wildfake_train.yaml \
#       --out results/audit_sizes__wildfake-train.json
#
# and use the `recommended_s_max` it prints. `scripts/after_fetch.sh` runs this
# for you and stops here.
crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256 # set to recommended_s_max  from audit_sizes__wildfake-train.json

hidden: 512
n_layers: 2
dropout: 0.0

epochs: 40
lr: 0.001
weight_decay: 0.01
batch_size: 32
head_batch_size: 64
num_workers: 4
seed: 0
device: auto

wandb:
  enabled: false
  project: grace-adapter
  group: ""
