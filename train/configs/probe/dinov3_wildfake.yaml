# Stage 0 -- fit the PoC detector's classification head. PoC only.
#
#   python scripts/train_probe.py configs/probe/dinov3_wildfake.yaml
#
# The one script in this project that trains a detector, and it exists because a
# DINOv3 trunk has no classifier: GRACE cannot adapt a seam whose head does not
# exist yet. Every other detector arrives with its head already trained by its
# authors and never touches this directory.
#
# Where the head lands is NOT written here. `out` defaults to the
# `head_checkpoint` the detector config already names, so the path the probe
# writes and the path the detector loads are one string in one file.
#
# Clean images only, no degradation augmentation -- that is the premise. See
# grace/probe/train.py. WildFake honours it better than NTIRE did: no
# corpus-wide degradation pass, so L0 really is L0.

run_id: dinov3_wildfake

detector: eval/configs/detectors/dinov3-wildfake.yaml
dataset: load_data/configs/datasets/wildfake_train.yaml       # split: train, 100,000

# Selection on the held-out validation split of the same manifest -- 20,000
# images, balanced 10k/10k, disjoint from `train` by construction and carrying
# the same tier weights and stratum proportions.
#
# Sound here for the same reason it was under NTIRE: the REPORTED benchmark is
# configs/datasets/wildfake_test.yaml (COCO val2017 + DALL-E 3), and nothing
# selected on this split is ever reported against it.
#
# ONE dataset now, where NTIRE supplied two (val + val_hard) and selection was
# their unweighted mean. There is no "hard" analogue in WildFake, so the mean is
# gone and the selection scalar is simply this split's AUC. What that costs: the
# old pair could catch a head that won the mean by collapsing on the hard set,
# and nothing here can. The per-generator breakdown in `summary.json` is the
# replacement -- `generator_column` records each fake's architecture, so a head
# that collapses on one family is visible there rather than in the scalar.
val_dataset:
  - load_data/configs/datasets/wildfake_train_val.yaml

split: eval.splits.dinov3.DINOv3Split
out: ""             # "" = take it from the detector config's head_checkpoint

# Head geometry. Written here rather than read from the detector config because
# this is what *decides* it: the checkpoint carries hidden/n_layers/dropout and
# the detector rebuilds from those, so a mismatch cannot happen.
hidden: 512
n_layers: 2
dropout: 0.0

epochs: 40
lr: 0.001
weight_decay: 0.01
batch_size: 32      # images per trunk forward, during feature extraction
head_batch_size: 64 # features per optimizer step -- the trunk runs once, ever
num_workers: 4
seed: 0
device: auto

# Optional. `--wandb --wandb-group <experiment>` on the command line does the
# same thing without editing a file, which is what a sweep wants.
wandb:
  enabled: false
  project: grace-adapter
  group: ""
