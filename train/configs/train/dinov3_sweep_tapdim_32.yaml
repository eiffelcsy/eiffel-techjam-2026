# E7 sweep, rung 1 of 3 -- tap_dim BELOW the built default. The cheap rung.
#
# This is the rung where a null result is the good one. GRACE's claim rests on
# the correction being tiny ("if a large adapter turns out to be needed, the
# claim is false"), so a ladder that works at tap_dim 32 is a better result than
# one that needs 256, independently of which recovers more retention.
#
#   tap_dim   ladder    total    x base   per-pair rank
#   32        0.094M    0.695M    1.16x      32          <- this file
#   64        0.180M    0.781M    1.30x      64          <- dinov3_ladder_final.yaml
#   128       0.353M    0.953M    1.59x     128
#   256       0.697M    1.298M    2.16x     128
#
# Base adapter is 0.601M at this geometry (bottleneck 128, n_blocks 3, K=5).
# Cost is linear at ~2,693 params per unit of tap_dim, and 71% of that is `rung`
# rather than `tap_proj` -- so tap_dim is mostly buying per-(block, tap)
# capacity, not compression width.
#
# Why 32 is a live possibility rather than a formality: the measurement that
# selected the tap blocks identified which of nine transforms hit an image at
# 0.896 from THIRTEEN SCALARS -- one drift norm per hidden state. Whatever says
# "which damage is this" is very low-dimensional. The ladder needs more than
# that, since it has to inform the correction's direction and not merely
# classify, but there is no reason to assume 64 is the floor.
#
# THE CACHE IS UNAFFECTED. tap_dim is a model-side knob: the cache stores raw
# (K, 768) taps and every rung of this sweep reads the same bytes. Unlike
# `tap_blocks`, sweeping it costs stage-1 time and nothing else.
#
# Read on `tap_gate/*` and `cosine_to_clean`, not on AUC -- hard-split AUC has a
# 0.0081 standard error and cannot resolve what separates these rungs. If the
# tap gates at 32 sit where they do at 64 and cosine_to_clean is unchanged, the
# extra width was never being used.
#
#   python scripts/train_adapter.py configs/train/dinov3_sweep_tapdim_32.yaml
#
# Identical to dinov3_ladder_final.yaml except `adapter.tap_dim`. That file is
# the tap_dim 64 rung of this sweep, so there is no separate config for it.

run_id: dinov3_sweep_tapdim_32

detector: eval/configs/detectors/dinov3-wildfake.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

split_args:
  tap_blocks: [0, 2, 4, 6, 9]

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_val_taps/dinov3-wildfake

cache_dir: cache_taps/dinov3-wildfake
epochs: 12
seed: 0
target_view: clean
source: cache

checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3
  taps: true
  tap_dim: 32       # THE swept key

loss:
  w_err: 4.0
  w_cos: 0.25
  eps_iso: 0.01

wandb:
  enabled: true
  project: grace-adapter
  group: e7_ladder_tapdim
