# THE REFERENCE ARM UNDER THE CROP PROTOCOL. dinov3_clean.yaml, re-pointed.
#
#   python scripts/train_adapter.py configs/train/dinov3_multiscale.yaml
#   python scripts/train_adapter.py configs/train/dinov3_multiscale.yaml --seed 1 --run-id dinov3_multiscale_s1
#
# Identical to dinov3_clean.yaml in every key that shapes the objective -- same
# loss weights, same geometry, same schedule, same epochs, same seed -- and
# different in exactly the four that say WHICH PIXELS: the detector, the two
# cache roots and the `crop:` block. Diffing the two files is the whole
# statement of what the multi-scale protocol changed.
#
# WHY IT IS A NEW FILE RATHER THAN AN EDIT. dinov3_clean.yaml is the control for
# nine ablations and every detector config loads its `ema.pt`. Repointing it
# would move all of them at once and silently invalidate the comparison each was
# built to make. So the crop era gets its own reference arm, its own five-seed
# floor, and its own ablation family as those are re-run against it.
#
# WHAT LOADS THIS RUN'S CHECKPOINT: configs/train/dinov3_enrich.yaml (stage 2)
# and configs/detectors/dinov3+grace-freq*.yaml (the harness arms). They name
# checkpoints/grace/dinov3_multiscale/ema.pt, so this must run before either.
#
# `crop:` here is not decoration -- stage 1 reads a cache, but `crop_sha` is what
# stops it reading a WHOLE-IMAGE cache while believing it trained on windows, and
# the fingerprint comes from this block. It must match the cache config's.

run_id: dinov3_multiscale

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_ms_val/dinov3-wildfake-multiscale

cache_dir: cache_ms/dinov3-wildfake-multiscale
epochs: 12
seed: 0
target_view: clean
source: cache
checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3

loss:
  w_err: 4.0
  w_cos: 0.25
  eps_iso: 0.01

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json

wandb:
  enabled: true
  project: grace-adapter
  group: ""
