# The loss ablation: Jacobian weighting OFF. `weighting: none` makes L_err
# exactly `F.mse_loss`. Identical to dinov3_multiscale.yaml except
# `loss.weighting` -- every other loss key is written out verbatim so the diff
# is exactly one key.
#
#   python scripts/main/train_adapter.py configs/train/dinov3_plain_mse.yaml

run_id: dinov3_plain_mse

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_ms_val/dinov3-wildfake-multiscale

cache_dir: cache_ms/dinov3-wildfake-multiscale
epochs: 12
seed: 0
target_view: clean
source: cache

checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3

loss:
  weighting: none   # THE ablated key. L_err becomes plain F.mse_loss, provably
                    # and not approximately -- tests/test_losses.py pins the
                    # equivalence.
  w_err: 4.0        # Every other value here is the reference arm's, written
  w_cos: 0.25       # out verbatim rather than inherited, so a diff against it
  eps_iso: 0.01     # shows exactly one changed key.

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json

wandb:
  enabled: true
  project: grace-adapter
  group: e3_losses
