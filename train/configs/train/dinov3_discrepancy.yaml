# Stage 2 -- GRACE-D's supervised auxiliary head, against the FROZEN
# multiscale adapter (dinov3_multiscale.yaml). The adapter is frozen, so GRACE
# and GRACE-D ship the same weights bit for bit.
#
#   python scripts/train_discrepancy.py configs/train/dinov3_discrepancy.yaml

run_id: dinov3_disc
cache_dir: cache_ms/dinov3-wildfake-multiscale
adapter_checkpoint: checkpoints/grace/dinov3_multiscale/ema.pt

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_ms_val/dinov3-wildfake-multiscale

epochs: 4
batch_size: 64
seed: 0

discrepancy:
  hidden: 256
  proj: 64
  use_severity: true

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json

wandb:
  enabled: true
  project: grace-adapter
  group: ""
