# Is the gate learning, or is it just being decayed open? Identical to the
# reference arm (dinov3_multiscale.yaml) except `decay_gate: false`, which
# exempts `gate_logit` from weight decay and leaves everything else untouched.
#
#   python scripts/train_adapter.py configs/train/dinov3_gate_nodecay.yaml

run_id: dinov3_gate_nodecay

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_ms_val/dinov3-wildfake-multiscale

cache_dir: cache_ms/dinov3-wildfake-multiscale
epochs: 12
seed: 0
target_view: clean
source: cache
checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10
decay_gate: false   # THE swept key

adapter:
  bottleneck: 128
  n_blocks: 3

loss:
  w_err: 4.0
  w_cos: 0.25
  eps_iso: 0.01

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json

wandb:
  enabled: false
  project: grace-adapter
  group: e_gate_init
