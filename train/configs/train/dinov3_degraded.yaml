# Arm A / control for dinov3_multiscale.yaml -- target is the DEGRADED view
# itself, detached (symmetric self-distillation, no clean teacher). Should do
# nothing useful; if it matches arm B on retention, the clean teacher was not
# the mechanism. Differs from dinov3_multiscale.yaml in `target_view` alone.

run_id: dinov3_degraded

detector: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
split: eval.splits.dinov3.DINOv3Split
dataset: load_data/configs/datasets/wildfake_train.yaml

val_datasets:
  - load_data/configs/datasets/wildfake_train_val.yaml
val_cache_dirs:
  - cache_ms_val/dinov3-wildfake-multiscale

cache_dir: cache_ms/dinov3-wildfake-multiscale
epochs: 12
seed: 0
target_view: degraded
source: cache
checkpoint_every: 2
val_every: 4

batch_size: 256
warmup_steps: 10

adapter:
  bottleneck: 128
  n_blocks: 3

loss:
  w_err: 4.0        # the reference arm's -- NOT the swept key
  w_cos: 0.25
  eps_iso: 0.01

crop:
  enabled: true
  s_min: 128
  policy: uniform
  seed: 0
  s_max: 256          # from results/audit_sizes__wildfake-train.json

wandb:
  enabled: true
  project: grace-adapter
  group: ""
