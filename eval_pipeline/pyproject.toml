[project]
name = "robust-aigc-eval"
version = "0.1.0"
description = "Evaluation harness and inference for robust AI-generated image detection"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "tabulate",
    "transformers",
    "datasets",
    "huggingface-hub",
]

[project.optional-dependencies]
dev = ["pytest"]

# The detector zoo's dependencies, kept out of the base install: nothing in
# `pipeline` imports them, only the three vendored-repo adapters do, and each
# adapter defers its imports so the harness runs without any of this.
#   timm  -- B-Free's ViT-with-registers backbone; >=1.0.12 for set_input_size
#   peft  -- GAPL's checkpoint keys are LoRA-wrapped and will not load without it
#   clip  -- RINE uses OpenAI's CLIP, not open_clip; ftfy and regex are its deps
zoo = [
    "timm>=1.0.12",
    "peft",
    "ftfy",
    "regex",
    "clip @ git+https://github.com/openai/CLIP.git",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
