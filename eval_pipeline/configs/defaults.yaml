# Reference: every key of every config kind, shown with its default.
# The harness never loads this file -- copy the bits you need.
#
# Three kinds of config, one file each, one directory each:
#
#   configs/datasets/<name>.yaml    what a dataset IS
#   configs/detectors/<name>.yaml   what a detector IS
#   configs/runs/<name>.yaml        detectors x datasets
#
# Adding a dataset is one new file under datasets/. Adding a detector is one
# new file under detectors/. Pairing them is one new file under runs/.
#
#   python scripts/build_manifest.py --config configs/datasets/<name>.yaml
#   python scripts/run_eval.py       --config configs/runs/<name>.yaml


# ---------------------------------------------------------------- dataset ----
# configs/datasets/<name>.yaml
# `name` and `manifest` are required. `source` is read only by
# build_manifest.py; once the manifest exists, evaluation ignores it.

name: my-dataset
manifest: ../data/my-dataset/manifest.parquet   # repo root, not this package:
                                               # grace_adapter reads this file too
split: null                 # which split to score; null = every row

source:
  target: pipeline.data.sources.HFImageDatasetSource
  args:
    dataset_id: some-org/some-dataset
    split: test
    fake_classes: [FAKE]    # class names meaning *generated*
    real_classes: null      # name these on a dataset with >2 classes; anything
                            # in neither set is then dropped rather than folded
                            # into real
    generator: UNKNOWN      # what produced the fakes
    image_column: image
    label_column: label
    limit: null             # per class; null = all
    streaming: false        # true for large repos -- see README

# ...or, for a dataset that ships as archives plus a metadata table rather than
# through the Hub. Images are referenced in place, never copied or re-encoded.
#
# source:
#   target: pipeline.data.sources.CsvMetadataSource
#   args:
#     csv_path: ../data/some-dataset/test_metadata.csv
#     root: ../data/some-dataset/images   # what the table's paths hang off
#     path_column: Image_path
#     label_column: IsFake
#     fake_values: ["1"]      # values of label_column meaning *generated*
#     real_values: ["0"]      # as above: name these on a richer label
#     path_prefix: null       # keep only these subtrees -- the subsetting knob
#                             # for when no column distinguishes the part you want
#     where: null             # {column: value | [values]} equality filter
#     generator: UNKNOWN
#     split: test             # recorded per row
#     limit: null             # per class; null = all
#     on_missing: error       # or "skip", when the table describes more of the
#                             # dataset than you downloaded


# --------------------------------------------------------------- detector ----
# configs/detectors/<name>.yaml
# `name` and `target` are required.

name: my-detector           # display name, used in result filenames
target: pipeline.detectors.dinov3.DINOv3MLPDetector
args:
  backbone_id: facebook/dinov3-vits16-pretrain-lvd1689m
  head_checkpoint: ../grace_adapter/checkpoints/probe/<run_id>/head.pt
  pool: cls+patchmean       # DINOv3's own linear-probe recipe, 768-d
  input_mode: resize        # resize | crop -- see INPUT_MODES in
                            # pipeline/detectors/dinov3.py
  hidden: 512
  n_layers: 2
device: auto                # auto -> cuda | mps | cpu; or "cuda:1"

# The ONE detector in the tree. `target` is a dotted import path rather than a
# registry key, so adding another is a new module under pipeline/detectors/ plus
# a config like this -- never an edit to pipeline code. The published zoo
# (B-Free, GAPL, RINE, and a generic Hub classifier) used to live here and was
# removed; that is what this shape is for if any of it comes back.


# -------------------------------------------------------------------- run ----
# configs/runs/<name>.yaml
# `run_id`, `datasets` and exactly one of `detector` / `detectors` are required.
# Loader knobs live here, not on the dataset: batch_size and num_workers are
# properties of this machine and max_images is a scope decision for this run.
#
# A minimal run config is four lines:
#
#   run_id: my_run
#   detector: configs/detectors/my-detector.yaml
#   datasets: [configs/datasets/my-dataset.yaml]
#   degrade: {}

run_id: my_run
detector: configs/detectors/my-detector.yaml   # path, or the mapping inline
# detectors:                                   # ...or a list, to score a zoo in
#   - configs/detectors/a.yaml                 # one command. Each is loaded,
#   - configs/detectors/b.yaml                 # run, and released in turn; the
#                                              # loader knobs below are shared.
datasets:                                      # paths, or mappings inline
  - configs/datasets/my-dataset.yaml

out_dir: results/           # -> results/{run_id}__{detector}__{dataset}.json
max_images: null            # per class; null = all. The one knob that moves
                            # wall-clock by an order of magnitude.
batch_size: 32
num_workers: 4              # raise on a cluster node, lower on a laptop
retention_floor: 0.5        # `operating_envelope` = deepest level at or above this

degrade: {}                 # `{}` accepts every default below
  # grid_file: configs/degradations.yaml
  # levels: [0, 1, 2, 3]    # 0 clean, 1 single, 2 pair, 3 multi. 0 is mandatory.
  # n_replicates: 3         # independent L2/L3 re-draws over the same images
  # transforms: null        # null = all eleven
  # seed: 0                 # fixes the eval subset and every degradation draw
