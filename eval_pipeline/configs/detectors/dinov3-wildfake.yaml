# The proof-of-concept detector: frozen DINOv3 ViT-S/16 + an MLP probe head.
#
# Unlike every other detector here, this one is not somebody else's published
# checkpoint -- the head is fit by grace_adapter/scripts/train_probe.py against
# configs/datasets/wildfake_train.yaml (split: train).
#
# GRACE's claim concerns a detector fit on CLEAN data whose accuracy collapses
# under JPEG, blur and resize -- that is the premise, not a shortcut. WildFake
# satisfies it better than the NTIRE set this replaced: NTIRE mixed in-the-wild
# transformations into both classes with no flag to filter them, so "fit on
# clean data" was only approximately true there. WildFake's images are as
# generated and as collected, with no corpus-wide degradation pass, so L0 really
# is L0. That is the main methodological gain from the dataset change.
#
# What to watch instead, both documented in wildfake_train.yaml: the real half
# is 36.9% single-subject corpora (faces, churches, animal faces) against a COCO
# benchmark, and the SD/Midjourney rows come from one archive part each rather
# than a uniform draw over those families.
#
# `input_mode` is left at its `resize` default here -- the whole image squashed
# to 224x224. See INPUT_MODES in pipeline/detectors/dinov3.py, and
# configs/detectors/dinov3-wildfake-crop.yaml for the arm that changes it. On
# SID_Set, two datasets ago, `resize` produced a head that read content rather
# than generation traces; that has never been re-tested on WildFake, and D1 is
# the experiment that does it.
#
# Run stage 0 before anything reads this file with a non-null head:
#
#   cd ../grace_adapter && python scripts/train_probe.py configs/probe/dinov3_wildfake.yaml
#
# `head_checkpoint` is the one path both sides use -- train_probe.py reads it
# out of THIS file to decide where to write. Change it in one place.
#
# The backbone is gated on the Hub. Accept the licence at
# https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m and run
# `hf auth login` once, or point `backbone_id` at a mirror you already have --
# nothing in the code assumes the official id.
#
# `pool: cls+patchmean` is DINOv3's own linear-probe recipe (768-d). It also
# matters here specifically: generation traces are a local high-frequency
# phenomenon, and a detector reading only the CLS token would lean on semantics
# and lose accuracy for reasons unrelated to the artefacts degradation destroys.
#
# Device placement is the pipeline's job -- `device: auto` picks cuda/mps/cpu.

name: dinov3-wildfake
target: pipeline.detectors.dinov3.DINOv3MLPDetector
args:
  backbone_id: facebook/dinov3-vits16-pretrain-lvd1689m
  head_checkpoint: ../grace_adapter/checkpoints/probe/dinov3_wildfake/head.pt
  pool: cls+patchmean
  hidden: 512
  n_layers: 2
device: auto
