# The PoC comparison, in one run: the same detector three ways.
#
#   +identity   null adapter. MUST reproduce dinov3_poc_baseline exactly -- if it
#               does not, the split is wrong and nothing below means anything.
#   +grace      the label-free adapter (stage 1)
#   +grace-d    stage 1 plus the supervised discrepancy branch (stage 2)
#
# Same conditions, same threshold rule, same retention denominator, same JSON
# schema as the baseline, because it is the same harness and the same code path.
# The detectors differ by one config file each.
#
#   python scripts/run_eval.py --config configs/runs/dinov3_poc_grace.yaml
#
# Detectors are loaded, scored and released one at a time, so this costs one
# model's memory however many are listed.
#
# THE DATASET MUST MATCH dinov3_poc_baseline.yaml's, and that is a hard
# requirement rather than a convention. Every headline number in this project is
# produced by grace_adapter/scripts/compare.py, which normalizes retention by the
# BASELINE's clean AUC -- the harness's own retention divides by each detector's
# own clean AUC, which for GRACE-D would hide exactly the effect being claimed.
# compare.py refuses two result files from different eval sets, because
# retention is only comparable on one. So: baseline and arms, same datasets list.
#
# WildFake and not ntire_val, for the reason dinov3_poc_baseline.yaml gives at
# length -- ntire_val is a SELECTION set here (stage 0 picks the head's epoch on
# it, stage 1 validates on it at image level), so a retention curve measured
# there is optimistic for both the baseline and the adapter. ntire_val is still
# reported for stage 1, but in checkpoints/grace/<run>/summary.json under
# `validation`, not through the harness.

run_id: dinov3_poc_grace

detectors:
  - ../grace_adapter/configs/detectors/dinov3+identity.yaml
  - ../grace_adapter/configs/detectors/dinov3+grace.yaml
  - ../grace_adapter/configs/detectors/dinov3+grace-d.yaml

datasets:
  - configs/datasets/wildfake_coco_dalle3.yaml

max_images: null   # per class; null = all 13,841 rows, as the baseline scores it
degrade: {}
