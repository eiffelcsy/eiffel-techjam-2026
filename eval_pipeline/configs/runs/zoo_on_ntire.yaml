# The detector zoo: three published detectors on one eval set, one command.
#
# Each is loaded, scored across every dataset, and released before the next is
# built, so this costs one detector's memory however many are listed. Every
# detector sees byte-identical degraded images -- degradation is seeded on the
# image index and applied before any detector's preprocessing -- so a difference
# between two rows is a difference between the detectors.
#
# B-Free is NOT here: it takes images at native resolution and needs
# batch_size: 1, and batch_size is shared across a run. See
# configs/runs/zoo_bfree_on_ntire.yaml, which writes into the same out_dir, so
# `scripts/report.py --results results/` still compares all four.

run_id: zoo

detectors:
  - configs/detectors/gapl.yaml
  - configs/detectors/rine-ldm.yaml
  - configs/detectors/rine-4class.yaml

datasets:
  - configs/datasets/ntire_val.yaml

degrade: {}     # the standard sweep: all four levels, all eleven transforms
