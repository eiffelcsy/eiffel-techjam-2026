# E7 through the harness: the ladder adapter on the same WildFake denominator as
# every other arm.
#
#   python scripts/run_eval.py --config configs/runs/dinov3_poc_ladder.yaml
#
# A SEPARATE run rather than a fourth detector in dinov3_poc_grace.yaml, for two
# reasons. The ladder needs the tap caches, a separate 21 GB render, so it can be
# late or absent without holding up the main comparison. And it is an
# ARCHITECTURE arm, not one of the three arms the PoC comparison is about
# (identity / restoration / fusion) -- keeping it out means the headline run
# cannot be quietly re-scoped by adding to it.
#
# `dinov3+grace-ladder.yaml` loads checkpoints/grace/dinov3_ladder_final/ema.pt,
# the 12-epoch ladder at the reference arm's loss weights. Do not point it at a
# 4-epoch ladder: a third of the training is not a worse architecture, and the
# comparison against dinov3+grace would be reading epochs, not taps.
#
# Same dataset and sweep as dinov3_poc_baseline.yaml, so compare.py accepts the
# pair.

run_id: dinov3_poc_ladder

detector: ../grace_adapter/configs/detectors/dinov3+grace-ladder.yaml

datasets:
  - configs/datasets/wildfake_coco_dalle3.yaml

max_images: null
degrade: {}
