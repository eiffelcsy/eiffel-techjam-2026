# B-Free, alone, because of batch_size.
#
# It feeds the image to the network at native resolution -- the 504x504 cropping
# happens inside, in token space -- so the tensors in a batch are not the same
# size and `collate`'s torch.stack cannot combine them. batch_size: 1 is a
# correctness requirement here, not a memory knob, and batch_size is a property
# of the run rather than the detector, so B-Free gets its own run config.
#
# `run_id` differs from the zoo run's, but `out_dir` defaults to the same
# results/, and the report keys on (detector, dataset) -- so this lands
# alongside the other three and `scripts/report.py` compares all four.

run_id: zoo_bfree

detector: configs/detectors/bfree.yaml

datasets:
  - configs/datasets/sid_set.yaml

batch_size: 1

degrade: {}     # the standard sweep: all four levels, all eleven transforms
