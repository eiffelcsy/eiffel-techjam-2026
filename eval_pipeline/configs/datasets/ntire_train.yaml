# NTIRE 2026 Robust AI-Generated Image Detection -- training set.
# https://huggingface.co/datasets/deepfakesMSU/NTIRE-RobustAIGenDetection-train
#
# ONE split: `train`, all six shards, 277,643 images.
#
# Model selection does NOT happen here. Stage 0 selects on the challenge's own
# val sets (ntire_val.yaml + ntire_val_hard.yaml) and stage 1 validates on the
# same two, at image level. That is sound in THIS project because the reported
# benchmark is WildFake (configs/datasets/wildfake_coco_dalle3.yaml), not NTIRE
# val -- nothing selected on NTIRE val is ever reported against NTIRE val.
#
# Shard 5 used to be held out under `split: validation`, read through
# configs/datasets/ntire_train_eval.yaml. With selection moved off it, holding it
# back only cost 27,643 training images, so it now carries `split: train` with
# the rest. ntire_train_eval.yaml is superseded and selects zero rows.
#
# Layout on disk -- unpack each shard_*.zip under ../data/ntire_train/:
#
#   ../data/ntire_train/shard_0/images/*.jpg
#   ../data/ntire_train/shard_0/labels.csv     image_name,label (0 real, 1 generated)
#   ... through shard_5
#
# 277,650 images, ~114 GB unpacked. Delete the shard entries you have not
# downloaded -- `on_missing: error` will otherwise stop on the first absent file,
# which is the intended behaviour for a shard you *meant* to have. Set `limit`
# (per class, per shard) to work against a subset without touching the layout.
#
# CsvMetadataSource references images in place and copies nothing. That is
# load-bearing here: these are JPEGs, and re-encoding them to PNG the way
# HFImageDatasetSource must would resample away the compression artefacts a
# detector keys on.
#
# CAVEAT -- read before fitting a head on this.
# The NTIRE train set already contains "in-the-wild" transformations (crop,
# resize, compression, blur) mixed into both classes, and unlike the validation
# set its labels.csv carries no `is_distorted` flag to separate them. GRACE's
# premise is a head fit on CLEAN images whose accuracy then collapses under
# degradation; a head fit here has already seen degraded data, so the retention
# curve measures something weaker than it did on a clean-only training set.
# There is no way to filter it from the table -- it is a property of the dataset.

name: ntire_train
manifest: ../data/ntire_train/manifest.parquet
split: train

source:
  target: pipeline.data.sources.ConcatSource
  args:
    sources:
      - target: pipeline.data.sources.CsvMetadataSource
        args: &shard
          csv_path: ../data/ntire_train/shard_0/labels.csv
          root: ../data/ntire_train/shard_0/images
          path_column: image_name
          label_column: label
          fake_values: [1]
          real_values: [0]
          generator: NTIRE-2026-train   # the card does not name the generators
          split: train
          limit: null                   # per class, per shard
      - target: pipeline.data.sources.CsvMetadataSource
        args:
          <<: *shard
          csv_path: ../data/ntire_train/shard_1/labels.csv
          root: ../data/ntire_train/shard_1/images
      - target: pipeline.data.sources.CsvMetadataSource
        args:
          <<: *shard
          csv_path: ../data/ntire_train/shard_2/labels.csv
          root: ../data/ntire_train/shard_2/images
      - target: pipeline.data.sources.CsvMetadataSource
        args:
          <<: *shard
          csv_path: ../data/ntire_train/shard_3/labels.csv
          root: ../data/ntire_train/shard_3/images
      - target: pipeline.data.sources.CsvMetadataSource
        args:
          <<: *shard
          csv_path: ../data/ntire_train/shard_4/labels.csv
          root: ../data/ntire_train/shard_4/images
      # Shard 5 was the stage-0 selection set; it is now training data like the
      # rest. Model selection moved to the challenge's own val sets -- see the
      # header. Inherits `split: train` from the anchor.
      - target: pipeline.data.sources.CsvMetadataSource
        args:
          <<: *shard
          csv_path: ../data/ntire_train/shard_5/labels.csv
          root: ../data/ntire_train/shard_5/images
