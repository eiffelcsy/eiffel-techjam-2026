# saberzl/SID_Set -- 3 classes in a plain int64 column (no ClassLabel names):
#   0 = real, 1 = full synthetic, 2 = tampered

name: sid_set
manifest: ../data/sid_set/manifest.parquet
split: validation

source:
  target: pipeline.data.sources.HFImageDatasetSource
  args:
    dataset_id: saberzl/SID_Set
    split: validation           # 30k rows; train is 210k
    fake_classes: ["1", "2"]         # full synthetic and tampered
    real_classes: ["0"]         # real
    generator: SID_Set-full-synthetic
    limit: 100                  # per class -- raise once a first run is proven
    streaming: true
