# The selection half of ntire_train. Same manifest file, other split.
#
# No `source:` block on purpose -- there is nothing to build here, and a second
# copy of the source spec is a second place for the two halves to drift apart.
# Build it with:
#
#   python scripts/build_manifest.py --config configs/datasets/ntire_train.yaml
#
# This is shard 5, held out from the head fit. It is a SELECTION set, not the
# benchmark: report against configs/datasets/ntire_val.yaml.

name: ntire_train_eval
manifest: ../data/ntire_train/manifest.parquet
split: validation
