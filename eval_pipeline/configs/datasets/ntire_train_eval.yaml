# SUPERSEDED -- selects zero rows. Kept so the change is visible rather than
# silent, and so a run that still references it fails loudly instead of training
# on an empty manifest by accident.
#
# This was the selection half of ntire_train: shard 5, held out from the head
# fit under `split: validation`. Stage 0 now selects on the challenge's own val
# sets (ntire_val.yaml + ntire_val_hard.yaml), which made holding shard 5 back
# pure cost, so ntire_train.yaml gives all six shards `split: train`. No row in
# that manifest carries `split: validation` any more.
#
# Nothing should reference this file. Point stage-0 `val_dataset` and stage-1
# `val_datasets` at ntire_val.yaml / ntire_val_hard.yaml instead.
#
# No `source:` block on purpose -- there is nothing to build here, and a second
# copy of the source spec is a second place for the two halves to drift apart.

name: ntire_train_eval
manifest: ../data/ntire_train/manifest.parquet
split: validation
