# NTIRE 2026 Robust AI-Generated Image Detection -- validation set (10k).
# https://huggingface.co/datasets/deepfakesMSU/NTIRE-RobustAIGenDetection-val
#
# TWO splits in one manifest, and here the reason is the degradation grid rather
# than the probe:
#
#   split: undistorted   <- this file. 5000 images the challenge left alone.
#   split: distorted     <- configs/datasets/ntire_val_distorted.yaml, SAME
#                           manifest. 5000 images the challenge already degraded.
#
# `val_labels.csv` marks this itself in `is_distorted`, so the split is the
# dataset's own statement, not our guess. 10,000 rows, balanced 5000 real /
# 5000 generated, and balanced again 5000 undistorted / 5000 distorted.
#
# Why the harness must not score the two together
# -----------------------------------------------
# L0 is the reference every retention number divides by, and L1 is a
# one-factor-at-a-time sweep whose whole claim is that each result is
# attributable to exactly one cause. Both statements are false on an image the
# challenge already downscaled and JPEG'd: "clean" is not clean, and
# `jpeg/quality=30` on top of an unknown prior compression is not one factor.
# Point the degradation sweep at THIS split, where L0 really is L0.
#
# The distorted half is not a lesser eval -- it is the challenge's own in-the-wild
# robustness benchmark, and the honest way to read it is at L0 only, as a second
# number beside the retention curve. Its 19 transform types (downscale,
# lincontrchange, jpeg, randomcrop, randomaspectcrop, darken, brighten,
# impulsenoise, rgbshift, colorshift, gausblur, pixelate, whitenoise, colorsat,
# quantization, lensblur, multnoise, motionblur, jitter) overlap our grid but are
# not the same list, so the two are complementary rather than redundant.
#
# Layout on disk -- unpack val_images.zip under ../data/ntire_val/:
#
#   ../data/ntire_val/images/*.jpg
#   ../data/ntire_val/val_labels.csv     image_name,label,distortions,
#                                        distortion_scales,is_distorted
#
# If the zip unpacks with its own top-level directory, fix `root` here -- it is
# the one place the path is written, and `on_missing: error` will say so loudly
# rather than silently building a manifest missing most of its images.
#
# NOTE: the dataset card's text still says labels are withheld. It is stale --
# val_labels.csv ships a populated `label` column (0 real, 1 generated).

name: ntire_val
manifest: ../data/ntire_val/manifest.parquet
split: undistorted

source:
  target: pipeline.data.sources.ConcatSource
  args:
    sources:
      - target: pipeline.data.sources.CsvMetadataSource
        args: &val
          csv_path: ../data/ntire_val/val_labels.csv
          root: ../data/ntire_val/images
          path_column: image_name
          label_column: label
          fake_values: [1]
          real_values: [0]
          generator: NTIRE-2026-val
          where: {is_distorted: 0}
          split: undistorted
      - target: pipeline.data.sources.CsvMetadataSource
        args:
          <<: *val
          where: {is_distorted: 1}
          split: distorted
