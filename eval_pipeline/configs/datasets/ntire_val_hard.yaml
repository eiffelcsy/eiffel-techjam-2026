# NTIRE 2026 -- the HARD validation subset (2.5k).
# https://huggingface.co/datasets/deepfakesMSU/NTIRE-RobustAIGenDetection-val
#
# 2500 rows, balanced 1250 real / 1250 generated, 1250 undistorted / 1250
# distorted. Kept whole rather than split by `is_distorted` the way ntire_val is:
# what makes this set hard IS its distortion list, and halving it to recover a
# clean L0 reference would throw away the only thing it measures.
#
# Score at LEVEL 0 ONLY. Its transforms go well beyond our grid and beyond the
# plain val set's:
#
#   adv_embed_resnet, adv_embed_clip     adversarial embedding attacks
#   jpeg_ai                              neural codec
#   jpeg_recompression_1 / _2 / _comb_jpegai
#   randomtonecurve, clahe, perspective, isonoise, ...
#
# The adversarial and neural-codec entries are the point: they are the cases a
# detector reading generation traces should fail on, and a detector reading
# content should not notice at all. That makes this set a sharp instrument for
# the question of WHICH signal a head has learned -- a large gap between
# ntire_val and ntire_val_hard is evidence of genuine forensic behaviour, and no
# gap at all is the signature of the semantic shortcut.
#
# Layout on disk -- unpack val_images_hard.zip under ../data/ntire_val_hard/,
# and put val_hard_labels.csv beside it:
#
#   ../data/ntire_val_hard/images/*.jpg
#   ../data/ntire_val_hard/val_hard_labels.csv

name: ntire_val_hard
manifest: ../data/ntire_val_hard/manifest.parquet
split: hard

source:
  target: pipeline.data.sources.CsvMetadataSource
  args:
    csv_path: ../data/ntire_val_hard/val_hard_labels.csv
    root: ../data/ntire_val_hard/images
    path_column: image_name
    label_column: label
    fake_values: [1]
    real_values: [0]
    generator: NTIRE-2026-val-hard
    split: hard
