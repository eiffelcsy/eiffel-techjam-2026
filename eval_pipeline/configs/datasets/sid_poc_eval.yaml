# The scoring half of sid_poc. Same manifest file, other split.
#
# No `source:` block on purpose -- there is nothing to build here, and a second
# copy of the source spec is a second place for the two halves to drift apart.
# Build it with:
#
#   python scripts/build_manifest.py --config configs/datasets/sid_poc.yaml
#
# The manifest index is the image identity that seeds every degradation, and
# `load_manifest` preserves it through the split filter -- so a row scored here
# has an index that never collided with a training row's.

name: sid_poc_eval
manifest: ../data/sid_poc/manifest.parquet
split: validation
