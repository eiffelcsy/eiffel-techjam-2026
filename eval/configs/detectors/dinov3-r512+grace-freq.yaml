# GRACE-freq on evaluation arm r512: the adapter, plus the DCT branch.
#
#   logit = head(enricher(adapter(trunk(x)), dct(x)))
#
# ONE KEY apart from dinov3-r512+grace.yaml -- the enricher checkpoint. Same
# base, same split, same adapter weights bit for bit, because stage 2 never
# touches the adapter. E12 is the difference between the two result files.
#
# WHY IT CAN EXCEED RETENTION 1.0. The adapter can only rearrange what the trunk
# kept, and the trunk was fed a 224px resize; whatever that destroyed is gone
# from its output at any capacity. The DCT branch reads the pixels directly, at
# native scale, so this arm is not bounded by the clean-feature score the way a
# restorer is.
#
# The DCT window is derived from the base detector's `input_mode` -- see
# `freq_branch.detectors.fused._freq_geometry` -- so the two branches read the same
# pixels without a second config key that could disagree with the first.

name: dinov3-r512+grace-freq
target: freq_branch.detectors.fused.FusedDetector
args:
  base: eval/configs/detectors/dinov3-wildfake-r512.yaml
  split: eval.splits.dinov3.DINOv3Split
  checkpoint: checkpoints/grace/dinov3_multiscale/ema.pt
  enricher: checkpoints/grace/dinov3_enrich/enricher.pt   # THE swept key
device: auto
