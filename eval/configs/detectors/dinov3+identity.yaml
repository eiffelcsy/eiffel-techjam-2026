# E1 for the PoC -- the null adapter: the split, wired up, with no trained weights.
#
# It MUST reproduce dinov3_poc_baseline to the last decimal. Run it before
# trusting any adapted result. Here it is close to a tautology -- DINOv3Split
# delegates to a detector whose `forward` IS `head(trunk(x))`, and `verify_split`
# checks it at construction -- which is exactly why the PoC is the right place to
# debug the rest of the pipeline: a mismatch cannot be blamed on the seam.
#
# Paths are relative to the repo root, since every script in the project is
# now run from there.

name: dinov3+identity
target: grace_adapter.detectors.adapted.AdaptedDetector
args:
  base: eval/configs/detectors/dinov3-wildfake-multiscale.yaml
  split: eval.splits.dinov3.DINOv3Split
  checkpoint: null
device: auto
