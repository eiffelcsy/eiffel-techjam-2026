# EVALUATION ARM (a): a 200x200 window at native pixel scale.
#
# Identical to dinov3-wildfake-multiscale.yaml but for `input_mode`, and loading
# the same head -- `HEAD_COMPATIBILITY` permits a multiscale-trained head under
# both arms, which is the whole point of training on one protocol and reporting
# on two fixed ones.
#
# WHY 200. Every real in wildfake_test is exactly 200x200 -- WildFake ships the
# COCO half pre-resized -- while the fakes are native 1024px DALL-E 3. Measured
# over all 13,841 rows, `max(w, h)` alone scores AUC 1.0000. 200 is therefore the
# largest square every image in the corpus can supply from its own pixels, so the
# reals pass through untouched and nothing is upsampled. The rule is "largest
# natively-available window"; the value falls out of the data.
#
# The property that matters: within this arm every image has identical
# dimensions, so the dimension shortcut is 0.5 BY CONSTRUCTION rather than by
# normalisation. This is the informative arm for the frequency branch.
#
# WHAT IT STILL LEAKS. The 200x200 reals are WildFake's downsamples of ~640x480
# COCO originals, so their spectra roll off at the old Nyquist while the fake
# windows are untouched native pixels. A frequency result here has to clear the
# spectral-rolloff floor (E-rolloff) before it is evidence about generation
# traces rather than about resampling history.

name: dinov3-wildfake-crop200
target: eval.detectors.dinov3.DINOv3MLPDetector
args:
  backbone_id: facebook/dinov3-vits16-pretrain-lvd1689m
  head_checkpoint: checkpoints/probe/dinov3_wildfake_multiscale/head.pt
  pool: cls+patchmean
  input_mode: crop200   # THE swept key
  hidden: 512
  n_layers: 2
device: auto
