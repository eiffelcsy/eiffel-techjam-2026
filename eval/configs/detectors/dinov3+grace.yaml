# GRACE on the PoC detector -- DINOv3 with the trained, LABEL-FREE adapter.
#
#   python scripts/run_eval.py --config eval/configs/runs/dinov3_poc_grace.yaml
#
# Same conditions, same clean threshold rule, same retention denominator, same
# result JSON as the baseline, because it is the same harness. The baseline and
# the adapted model differ by this one file.
#
# Ceiling: restoration cannot exceed the clean-feature score, so retention <= 1.0
# by construction. Beating that is the frequency branch's job.

name: dinov3+grace
target: grace_adapter.detectors.adapted.AdaptedDetector
args:
  base: eval/configs/detectors/dinov3-wildfake.yaml
  split: eval.splits.dinov3.DINOv3Split
  checkpoint: checkpoints/grace/dinov3_clean/ema.pt
device: auto
