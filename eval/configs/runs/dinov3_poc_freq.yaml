# THE HEADLINE RUN for the frequency branch: three detectors on the crop200 arm.
#
#   python scripts/main/run_eval.py --config eval/configs/runs/dinov3_poc_freq.yaml
#
# Scored on the crop200 evaluation arm -- a 200x200 window at native pixel
# scale, in distribution for a multi-scale-trained head, and the informative arm
# for frequency. Within the arm every image has identical dimensions, so the
# dimension shortcut -- which scores AUC 1.0000 on this benchmark raw -- is 0.5
# by construction rather than by normalisation.
#
# THREE ROWS, one key apart each:
#
#   +grace             the adapter alone. E12's control.
#   +grace-freq-null   a fresh enricher. MUST equal the row above to the last
#                      decimal (E10). If it does not, stop.
#   +grace-freq        the trained enricher. E12.
#
# All three run in ONE invocation so the condition lattice is built once: it is
# seeded on the image index, so every detector sees byte-identical degraded
# images and a difference between two rows is never a difference in the draw.
#
# READ IT AGAINST: results/shortcut__*.json (the container floor),
# results/freq_analysis__*.json (the spectral-rolloff floor), and
# dinov3_poc_baseline_arms (the unadapted retention curve, i.e. whether there
# was a collapse to repair at all).

run_id: dinov3_poc_freq

detectors:
  - eval/configs/detectors/dinov3-crop200+grace.yaml
  # - eval/configs/detectors/dinov3-crop200+grace-freq-null.yaml
  - eval/configs/detectors/dinov3-crop200+grace-freq.yaml

datasets:
  - load_data/configs/datasets/wildfake_coco_dalle3.yaml

max_images: null   # per class; null = all 13,841 rows
degrade: {}        # the standard sweep: all four levels, all eleven transforms
