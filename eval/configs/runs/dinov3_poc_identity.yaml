# E1, THE GATE. The null adapter, scored on its own, before anything is trained.
#
#   python scripts/run_eval.py --config eval/configs/runs/dinov3_poc_identity.yaml
#
# WHY THIS IS ITS OWN RUN. E1 asks whether `head(adapter(trunk(x)))` with a null
# adapter reproduces `detector(x)` exactly. If it does not, the trunk/head split
# is wrong and every adapted number afterwards is measured against a model nobody
# benchmarked -- which makes E1 a GATE on the whole project. A gate has to fire
# before the work it guards, and it cannot do that from inside
# dinov3_poc_grace.yaml, because that run needs a trained adapter to exist first.
#
# So: baseline, then this, then the cache render and everything downstream. It
# costs one pass over the eval set (13,841 images x 26 conditions) and it is the
# cheapest insurance in the pipeline.
#
# READ IT with grace_adapter/scripts/compare.py --assert-identity, which exits
# non-zero unless every level's retention delta is 0. `checkpoint: null` in the
# detector config means identity, which is not a broken config -- it is the arm.
#
# Same dataset and same degradation sweep as dinov3_poc_baseline.yaml, because
# compare.py refuses two result files from different eval sets and an identity
# check against a different set would prove nothing.

run_id: dinov3_poc_identity

detector: grace_adapter/configs/detectors/dinov3+identity.yaml

datasets:
  - load_data/configs/datasets/wildfake_coco_dalle3.yaml

max_images: null   # per class; null = all 13,841 rows, as the baseline scores it
degrade: {}        # the standard sweep: all four levels, all eleven transforms
