# P2': the unadapted detector's retention curve, on the crop200 evaluation arm.
#
#   python scripts/main/run_eval.py --config eval/configs/runs/dinov3_poc_baseline_arms.yaml
#
# This is the project's first real measurement and the denominator every GRACE
# arm is compared against. It replaces dinov3_poc_baseline.yaml, whose single
# `resize` arm scored a benchmark on which `max(w, h)` alone reaches AUC 1.0000 --
# so its retention curve would have described a resolution readout rather than a
# detector.
#
#   crop200   a 200x200 window at native pixel scale. In distribution for a
#             multi-scale-trained head, dimension shortcut 0.5 by construction.
#             THE informative arm.
#
# WHAT THIS RUN DECIDES. If retention does not collapse on this arm, GRACE has
# nothing to repair and the frequency branch has nothing to enrich -- and that is
# the finding, reported before anything is trained. Read it next to the
# E-shortcut baseline, which must sit at chance on the arm: if the shortcut is
# at chance AND retention does not move, the detector is separating on content
# that degradation does not touch, and no adapter fixes that.

run_id: dinov3_poc_baseline_arms

detectors:
  - eval/configs/detectors/dinov3-wildfake-crop200.yaml

datasets:
  - load_data/configs/datasets/wildfake_coco_dalle3.yaml

max_images: null   # per class; null = all 13,841 rows
degrade: {}        # the standard sweep: all four levels, all eleven transforms
