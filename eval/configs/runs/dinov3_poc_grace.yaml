# The PoC comparison: the adapted detector against the baseline.
#
#   +grace      the label-free adapter (stage 1)
#
# The identity arm, +identity, is NOT here. It is E1, the gate on everything else,
# and it lives in eval/configs/runs/dinov3_poc_identity.yaml so it can be scored right
# after the baseline -- before the cache render, before stage 1.
# Bundling it here would have meant the check that decides whether any of this is
# measurable could not run until all of it had been trained. It also saves a full
# pass over the eval set, since the identity arm is scored once instead of twice.
#
# Same conditions, same threshold rule, same retention denominator, same JSON
# schema as the baseline, because it is the same harness and the same code path.
# The detectors differ by one config file each.
#
#   python scripts/main/run_eval.py --config eval/configs/runs/dinov3_poc_grace.yaml
#
# Detectors are loaded, scored and released one at a time, so this costs one
# model's memory however many are listed.
#
# THE DATASET MUST MATCH dinov3_poc_baseline.yaml's, and that is a hard
# requirement rather than a convention. Every headline number in this project is
# produced by scripts/compare.py, which normalizes retention by the
# BASELINE's clean AUC -- the harness's own retention divides by each detector's
# own clean AUC, which for the frequency branch would hide exactly the effect
# being claimed. compare.py refuses two result files from different eval sets,
# because retention is only comparable on one. So: baseline and arms, same
# datasets list.
#
# The benchmark and not wildfake_train_val, for the reason dinov3_poc_baseline.yaml
# gives at length -- that split is a SELECTION set here (stage 0 picks the head's
# epoch on it, stage 1 validates on it at image level), so a retention curve
# measured there is optimistic for both the baseline and the adapter. It is still
# reported for stage 1, but in checkpoints/grace/<run>/summary.json under
# `validation`, not through the harness.

run_id: dinov3_poc_grace

detectors:
  - eval/configs/detectors/dinov3+grace.yaml

datasets:
  - load_data/configs/datasets/wildfake_coco_dalle3.yaml

max_images: null   # per class; null = all 13,841 rows, as the baseline scores it
degrade: {}
